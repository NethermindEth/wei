[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

markers =
    e2e: mark test as end-to-end test
    slow: mark test as slow running
    auth: mark test as authentication test
    analysis: mark test as proposal analysis test
    arguments: mark test as argument generation test
    custom: mark test as custom evaluation test
    cache: mark test as cache management test
    chat: mark test as chat functionality test
    community: mark test as community and roadmap test
    docs: mark test as API documentation test
