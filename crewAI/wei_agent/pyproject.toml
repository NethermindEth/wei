[project]
name = "wei_agent"
version = "0.1.0"
description = "wei-agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.201.1,<1.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
wei_agent = "wei_agent.main:run"
run_crew = "wei_agent.main:run"
train = "wei_agent.main:train"
replay = "wei_agent.main:replay"
test = "wei_agent.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
